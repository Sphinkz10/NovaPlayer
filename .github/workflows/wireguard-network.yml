name: Native WireGuard private HTTPS
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'connect/**'
      - 'server/**'
      - '.github/workflows/wireguard-network.yml'
permissions:
  contents: read
jobs:
  wireguard:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r server/requirements-directory.txt
      - name: WireGuard gateway tooling in disposable VM
        run: sudo apt-get update && sudo apt-get install -y wireguard-tools iproute2 iptables ffmpeg
      - name: Build isolated network proof APK
        working-directory: connect
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PnovaWireGuardProof=true --no-daemon --console plain
      - name: Emulator acceleration
        run: sudo chown "$(id -u):$(id -g)" /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python connect/wireguard-proof/network.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wireguard-network-api-${{ matrix.api }}
          path: |
            connect/test-results/wireguard/
            connect/app/build/outputs/apk/debug/app-debug.apk
