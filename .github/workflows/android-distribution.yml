name: Android distribution and update
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'connect/**'
      - '.github/workflows/android-distribution.yml'
permissions:
  contents: read
jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build unsigned distribution and synthetic next version
        working-directory: connect
        run: |
          bash gradlew :app:assembleDebug :app:assembleRelease :app:lintRelease --no-daemon --console plain
          mkdir -p test-results/distribution
          cp app/build/outputs/apk/release/app-release-unsigned.apk test-results/distribution/unsigned.apk
          bash gradlew :app:assembleRelease -PnovaVersionCode=14 --no-daemon --console plain
          cp app/build/outputs/apk/release/app-release-unsigned.apk test-results/distribution/unsigned-upgrade.apk
      - name: SDK signing gate with temporary identities
        run: >-
          python connect/scripts/check_distribution.py
          --unsigned connect/test-results/distribution/unsigned.apk
          --upgrade connect/test-results/distribution/unsigned-upgrade.apk
          --debug connect/app/build/outputs/apk/debug/app-debug.apk
          --output connect/test-results/distribution
      - name: Enable isolated emulator acceleration
        run: sudo chown "$(id -u):$(id -g)" /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python connect/scripts/smoke_distribution_android.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-distribution-api-${{ matrix.api }}
          path: connect/test-results/distribution/
