name: NOVA Cinema Android TV
on:
  push:
    branches: [main, feature/nova-cinema-signature-home]
    paths: ["cinema/**", ".github/workflows/cinema-android.yml"]
  pull_request:
    paths: ["cinema/**", ".github/workflows/cinema-android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager in runner Android SDK" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build NOVA Cinema APK
        run: gradle -p cinema :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nova-cinema-debug-apk
          path: cinema/app/build/outputs/apk/debug/app-debug.apk
