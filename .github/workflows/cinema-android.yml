name: NOVA Cinema Android TV
on:
  push:
    branches: [main, feature/nova-cinema-signature-home]
    paths: ["cinema/**", ".github/workflows/cinema-android.yml"]
  pull_request:
    paths: ["cinema/**", ".github/workflows/cinema-android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Build NOVA Cinema APK
        run: gradle -p cinema :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nova-cinema-debug-apk
          path: cinema/app/build/outputs/apk/debug/app-debug.apk
