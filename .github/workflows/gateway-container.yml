name: WireGuard generated container and remote media
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/gateway-container.yml'
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r server/requirements.txt
      - run: python server/scripts/smoke_lan_compose.py
        env:
          NOVA_GATEWAY_LAB: '1'
          NOVA_EVIDENCE_DIR: server/test-results/gateway-container
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gateway-container
          path: server/test-results/gateway-container/
