name: WireGuard generated container and remote media
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/gateway-container.yml'
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r server/requirements.txt
      - run: python server/scripts/smoke_lan_compose.py
        env:
          NOVA_GATEWAY_LAB: '1'
          NOVA_EVIDENCE_DIR: server/test-results/gateway-container
      - name: Publish the exact tested gateway image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch origin "$SOURCE_REVISION"
          git diff --exit-code "$SOURCE_REVISION" HEAD -- server
          image="ghcr.io/sphinkz10/nova-gateway:git-$SOURCE_REVISION"
          tested=$(cat server/test-results/gateway-container/gateway-local-image.txt)
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker tag "$tested" "$image"
          docker push "$image"
          docker inspect --format '{{index .RepoDigests 0}}' "$image" > server/test-results/gateway-container/IMAGE.txt
          printf '%s\n' "$SOURCE_REVISION" > server/test-results/gateway-container/SOURCE_COMMIT.txt
          docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gateway-container
          path: server/test-results/gateway-container/
