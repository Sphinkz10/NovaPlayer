name: Verify NOVA foundation
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'archives/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r server/requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results/pytest.xml
        working-directory: server
      - run: python scripts/smoke_http.py
        working-directory: server
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/smoke_browser.py --output test-results/browser
        working-directory: server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: server-${{ matrix.os }}-${{ matrix.python }}
          path: server/test-results/
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r server/requirements.txt --no-deps --disable-pip
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify wrapper JAR checksum
        working-directory: connect
        run: sha256sum -c gradle/wrapper/gradle-wrapper.jar.sha256
      - name: Build, behavioural tests and Android lint
        working-directory: connect
        run: bash gradlew :core:verifyCore :app:assembleDebug :app:lintDebug --no-daemon --console plain
      - run: python connect/scripts/check_source_hygiene.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connect-phase1-debug
          path: |
            connect/app/build/outputs/apk/debug/*.apk
            connect/app/build/reports/lint-results-debug.*
  compose-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r server/requirements.txt
      - run: python server/scripts/smoke_compose.py
